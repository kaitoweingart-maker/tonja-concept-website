# Netlify configuration for TONJA Concept
[build]
  publish = "."

# Long-cache immutable assets (images never change name → safe to cache hard)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# HTML: always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Pretty: send /?lang=en style links to the single page (already root, but keep clean)
[[redirects]]
  from = "/home"
  to = "/"
  status = 301
